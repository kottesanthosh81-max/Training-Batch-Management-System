# ============================================================
# Server Configuration (Runs on Port 8009 using Embedded Jetty)
# ============================================================
server.port=8009

# ============================================================
# MySQL Database Configuration
# Supports environment variables for Render / Production deployment
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/training_batch_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:EduSphere@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Hibernate & JPA Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Application Logging
# ============================================================
logging.level.com.training.batchmanagement=DEBUG
logging.level.org.eclipse.jetty=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
